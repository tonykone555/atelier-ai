<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090909;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.hero{min-height:88svh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;background:linear-gradient(135deg,#31271f,#080808);overflow:hidden}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0007 0%,transparent 25%,#0004 45%,#090909 95%);z-index:-1}.nav{position:absolute;top:0;left:0;right:0;padding:24px clamp(20px,5vw,70px);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:12px;font-weight:800;letter-spacing:.17em}.nav a{font-size:12px;border:1px solid #ffffff70;border-radius:30px;padding:12px 18px;backdrop-filter:blur(12px)}.hero-inner{padding:140px clamp(20px,5vw,70px) 55px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#e8c49c}.hero h1{font-size:clamp(48px,10vw,130px);font-weight:750;line-height:.94;letter-spacing:-.07em;overflow-wrap:anywhere;margin:20px 0}.hero p{color:#d1c9c1;max-width:570px;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.cta{background:#fff;color:#151515;border-radius:40px;padding:16px 23px;font-size:13px;font-weight:750}.cta.alt{background:#ffffff1c;color:#fff;border:1px solid #ffffff45}.main{padding:50px clamp(16px,5vw,70px) 100px}.topline{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.topline h2{font-size:clamp(38px,7vw,80px);letter-spacing:-.065em;line-height:1;margin:10px 0;font-weight:650}.muted{color:#9e9e9e;font-size:13px}.categories{display:flex;gap:9px;overflow-x:auto;padding:8px 0 30px;scrollbar-width:none}.categories button{background:#1d1d1d;color:#eaeaea;border:1px solid #333;padding:12px 18px;border-radius:50px;white-space:nowrap;cursor:pointer}.categories button.active{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.dish{background:#171717;border:1px solid #292929;border-radius:19px;overflow:hidden;min-width:0}.photo{aspect-ratio:1.1;position:relative;background:radial-gradient(circle at 70% 25%,#534235,#201d1b);overflow:hidden}.photo img{height:100%;width:100%;object-fit:cover;display:block}.no-photo{display:flex;height:100%;align-items:center;justify-content:center;color:#b8a48e;letter-spacing:.12em;font-size:10px}.dish-info{padding:19px}.dish h3{font-size:clamp(17px,2vw,22px);letter-spacing:-.03em;margin:0 0 9px}.dish p{font-size:13px;color:#aaa;line-height:1.5;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.price{font-weight:750;color:#e9c29a;font-size:18px}.footer{border-top:1px solid #303030;padding:45px clamp(20px,5vw,70px);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.footer strong{font-size:clamp(24px,4vw,42px);letter-spacing:-.06em}.footer p{color:#888;font-size:12px}.footer a{background:#fff;color:#111;border-radius:30px;padding:14px 20px;font-size:12px;font-weight:700}.mobile-order{display:none}@media(max-width:750px){.hero{min-height:77svh}.hero-inner{padding-bottom:45px}.hero h1{font-size:clamp(42px,12vw,80px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.dish{border-radius:14px}.dish-info{padding:12px}.dish p{font-size:12px}.price{font-size:15px}.main{padding-top:38px}.photo{aspect-ratio:.92}.footer{padding-bottom:95px}.mobile-order{display:block;position:fixed;z-index:5;bottom:calc(12px + env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;background:#fff;color:#111;border-radius:50px;padding:17px;font-weight:750;box-shadow:0 10px 30px #0009}}@media(max-width:370px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><header class="hero" id="top"><img id="hero-photo" alt="" hidden><nav class="nav"><span class="brand" id="nav-name">RESTAURANT</span><a href="#menu">LA CARTE ↗</a></nav><div class="hero-inner"><div class="eyebrow">RESTAURANT · DÉCOUVREZ NOTRE CARTE</div><h1 id="name">Votre restaurant</h1><p id="intro">Découvrez notre sélection de plats.</p><div class="actions"><a class="cta" href="#menu">Explorer le menu ↓</a><a id="order" class="cta alt" hidden target="_blank" rel="noopener noreferrer">Commander ↗</a></div></div></header><main class="main" id="menu"><div class="topline"><div><span class="eyebrow">À LA CARTE</span><h2>Notre Menu</h2><div id="count" class="muted"></div></div></div><nav class="categories" id="categories"></nav><div class="grid" id="grid"></div></main><footer class="footer"><div><strong id="footer-name">Restaurant</strong><p>Photos et prix issus du menu importé. Vérifiez les informations avant publication.</p></div><a id="footer-order" hidden target="_blank" rel="noopener noreferrer">Commander ↗</a></footer><a id="mobile-order" class="mobile-order" hidden target="_blank" rel="noopener noreferrer">Commander ↗</a><script>
(()=>{const $=id=>document.getElementById(id);let dishes=[],selected='Tous';function validImage(u){return typeof u==='string'&&/^https:\/\//i.test(u)}function money(d){if(typeof d.price!=='number'||!Number.isFinite(d.price))return 'Prix à confirmer';try{return new Intl.NumberFormat('fr-CH',{style:'currency',currency:/^(CHF|EUR|GBP)$/.test(d.currency)?d.currency:'CHF'}).format(d.price)}catch{return 'CHF '+d.price}}function render(){const grid=$('grid');grid.replaceChildren();const shown=selected==='Tous'?dishes:dishes.filter(d=>(d.category||'Menu')===selected);for(const d of shown){const article=document.createElement('article');article.className='dish';const photo=document.createElement('div');photo.className='photo';if(validImage(d.imageUrl)){const img=document.createElement('img');img.src=d.imageUrl;img.alt=d.name;img.loading='lazy';img.onerror=()=>{photo.replaceChildren();const empty=document.createElement('div');empty.className='no-photo';empty.textContent='PHOTO INDISPONIBLE';photo.appendChild(empty)};photo.appendChild(img)}else{const empty=document.createElement('div');empty.className='no-photo';empty.textContent='PHOTO À VENIR';photo.appendChild(empty)}const info=document.createElement('div');info.className='dish-info';const name=document.createElement('h3');name.textContent=d.name;info.appendChild(name);if(d.description){const desc=document.createElement('p');desc.textContent=d.description;info.appendChild(desc)}const price=document.createElement('div');price.className='price';price.textContent=money(d);info.appendChild(price);article.append(photo,info);grid.appendChild(article)}}function update(data){const name=String(data.name||'Restaurant').slice(0,120);dishes=Array.isArray(data.items)?data.items.filter(d=>d&&typeof d.name==='string').slice(0,1500):[];$('name').textContent=name;$('nav-name').textContent=name;$('footer-name').textContent=name;document.title=name+' — Restaurant';const photos=dishes.filter(d=>validImage(d.imageUrl));if(photos.length){$('hero-photo').src=photos[0].imageUrl;$('hero-photo').hidden=false;$('hero-photo').onerror=()=>{$('hero-photo').hidden=true}}else $('hero-photo').hidden=true;$('intro').textContent=dishes.length?'Découvrez '+dishes.length+' plats préparés par notre restaurant.':'Découvrez notre carte.';const cats=[...new Set(dishes.map(d=>d.category||'Menu'))];$('count').textContent=dishes.length+' plats · '+cats.length+' catégories';selected='Tous';const nav=$('categories');nav.replaceChildren();for(const cat of ['Tous',...cats]){const btn=document.createElement('button');btn.type='button';btn.textContent=cat;btn.className=cat===selected?'active':'';btn.onclick=()=>{selected=cat;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));render()};nav.appendChild(btn)}for(const id of ['order','footer-order','mobile-order']){const el=$(id);if(typeof data.sourceUrl==='string'&&/^https:\/\//.test(data.sourceUrl)){el.href=data.sourceUrl;el.hidden=false}else el.hidden=true}render()}window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='ATELIER_RESTAURANT_DATA')update(e.data.payload||{})});window.parent?.postMessage({type:'ATELIER_TEMPLATE_READY'},'*')})();
</script></body></html>
